<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos em Aberto · Canção Alimentos</title>
<style>
:root{
  --bg:#151312;
  --bg-panel:#1e1b19;
  --bg-card:#242019;
  --line:#3a332c;
  --red:#c0392b;
  --orange:#e07a3f;
  --cream:#f4ede1;
  --muted:#a89a86;
  --green:#5b8a5f;
  --amber:#c99a3a;
}
body.light{
  --bg:#f7f3ec;
  --bg-panel:#ffffff;
  --bg-card:#ffffff;
  --line:#e2d9c9;
  --red:#c0392b;
  --orange:#c1602c;
  --cream:#2a2420;
  --muted:#7a6f60;
  --green:#3f7a44;
  --amber:#a97a1f;
}
body.light .vend-card{box-shadow:0 1px 3px rgba(0,0,0,.06);}
body.light .lock{opacity:.35;}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  transition:background .2s, color .2s;
}
.tabs{
  position:absolute;top:20px;left:20px;display:flex;gap:8px;
}
.tabs a{
  display:flex;align-items:center;gap:6px;background:var(--bg-panel);
  border:1px solid var(--line);color:var(--cream);text-decoration:none;
  padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;
  transition:border-color .15s;
}
.tabs a:hover{border-color:var(--orange);}
.tabs a.active{background:var(--orange);color:#1a1613;border-color:var(--orange);}
.toolbar button{
  background:var(--bg-panel);border:1px solid var(--line);color:var(--cream);
  width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:border-color .15s, transform .15s;
}
.toolbar button:hover{border-color:var(--orange);}
.toolbar button:active{transform:scale(.92);}
.toolbar button.spinning svg{animation:spin .7s linear;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
header{position:relative;}
header{
  padding:34px 24px 22px;
  text-align:center;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1c1815,var(--bg));
  position:relative;
}
header h1{
  margin:0;
  font-family:Georgia,'Times New Roman',serif;
  font-size:30px;
  letter-spacing:.5px;
  color:var(--cream);
}
header h1 span{color:var(--orange);}
header p{margin:8px 0 0;color:var(--muted);font-size:14px;}

.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}

.summary{
  display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:28px;
}
.summary .pill{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 18px;font-size:13px;color:var(--muted);
}
.summary .pill b{color:var(--cream);font-size:16px;display:block;font-family:Georgia,serif;}

.search-row{margin-bottom:20px;}
.search-row input{
  width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-panel);color:var(--cream);font-size:14px;outline:none;
}
.search-row input:focus{border-color:var(--orange);}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;
}
.vend-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;cursor:pointer;transition:border-color .15s, transform .15s;
  position:relative;
}
.vend-card:hover{border-color:var(--orange);transform:translateY(-2px);}
.vend-card .lock{
  position:absolute;top:14px;right:14px;font-size:15px;opacity:.55;
}
.vend-card .name{
  font-size:15px;font-weight:600;color:var(--cream);margin-bottom:6px;padding-right:20px;
  line-height:1.3;
}
.vend-card .meta{font-size:12.5px;color:var(--muted);}
.vend-card .badge{
  display:inline-block;margin-top:10px;background:rgba(224,122,63,.15);
  color:var(--orange);border:1px solid rgba(224,122,63,.35);
  padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;
}

/* Modal password */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal-bg.active{display:flex;}
.modal{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
  padding:28px 26px;max-width:340px;width:100%;text-align:center;
}
.modal h3{margin:0 0 6px;font-family:Georgia,serif;font-size:19px;color:var(--cream);}
.modal p{margin:0 0 18px;color:var(--muted);font-size:13px;}
.modal input{
  width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg-card);color:var(--cream);font-size:20px;text-align:center;
  letter-spacing:6px;outline:none;margin-bottom:10px;
}
.modal input:focus{border-color:var(--orange);}
.modal .err{color:var(--red);font-size:12.5px;height:16px;margin-bottom:8px;}
.modal .actions{display:flex;gap:10px;}
.modal button{
  flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:13.5px;font-weight:600;
}
.modal .btn-confirm{background:var(--orange);color:#1a1613;}
.modal .btn-cancel{background:transparent;color:var(--muted);border:1px solid var(--line);}

/* Detail view */
.detail-view{display:none;}
.detail-view.active{display:block;}
.back-btn{
  background:none;border:1px solid var(--line);color:var(--cream);
  padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:18px;
}
.back-btn:hover{border-color:var(--orange);color:var(--orange);}
.detail-header{
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;
  margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px;
}
.detail-header h2{font-family:Georgia,serif;margin:0;font-size:24px;}
.detail-header .sub{color:var(--muted);font-size:13px;}
.total-kg-badge{
  background:rgba(224,122,63,.15);color:var(--orange);
  border:1px solid rgba(224,122,63,.4);border-radius:10px;
  padding:8px 16px;font-size:14px;font-weight:700;white-space:nowrap;
}

.pedido-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:14px;overflow:hidden;
}
.pedido-head{
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;gap:12px;flex-wrap:wrap;
}
.pedido-head:hover{background:rgba(224,122,63,.06);}
.pedido-head .left{display:flex;flex-direction:column;gap:3px;}
.pedido-head .num{font-weight:700;color:var(--orange);font-size:14.5px;}
.pedido-head .cliente{font-size:13.5px;color:var(--cream);}
.pedido-head .cidade{font-size:12px;color:var(--muted);}
.pedido-head .right{display:flex;align-items:center;gap:14px;}
.pedido-head .valor{font-weight:700;color:var(--cream);font-size:14.5px;}
.pedido-head .status{
  font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;
}
.status.liberado{background:rgba(91,138,95,.18);color:var(--green);border:1px solid rgba(91,138,95,.4);}
.status.outro{background:rgba(201,154,58,.18);color:var(--amber);border:1px solid rgba(201,154,58,.4);}
.chevron{color:var(--muted);transition:transform .2s;font-size:13px;}
.pedido-card.open .chevron{transform:rotate(180deg);}

.pedido-body{display:none;padding:0 18px 18px;border-top:1px solid var(--line);}
.pedido-card.open .pedido-body{display:block;}
.info-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
  margin:14px 0 16px;font-size:12.5px;
}
.info-grid .item b{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-bottom:2px;}
.info-grid .item span{color:var(--cream);}

table.prod-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.prod-table th{
  text-align:left;color:var(--muted);font-weight:600;padding:8px 8px;
  border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.4px;
}
table.prod-table td{padding:8px 8px;border-bottom:1px solid rgba(58,51,44,.5);color:var(--cream);}
table.prod-table tr:last-child td{border-bottom:none;}
.obs{margin-top:12px;font-size:12px;color:var(--muted);background:var(--bg-panel);padding:10px 12px;border-radius:8px;}

.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px;}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

@media (max-width: 640px){
  header{padding:16px 12px 18px;}
  .tabs, .toolbar{position:static;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .tabs a{padding:8px 12px;font-size:12px;}
  header h1{font-size:24px;margin-top:4px;}
  header p{font-size:12.5px;}
  .toolbar{top:14px;right:14px;}
  .toolbar button{width:34px;height:34px;font-size:14px;}
  .wrap{padding:18px 12px 40px;}
  .summary{gap:10px;margin-bottom:20px;}
  .summary .pill{padding:8px 14px;font-size:12px;flex:1;min-width:120px;}
  .summary .pill b{font-size:15px;}
  .grid{grid-template-columns:1fr;gap:10px;}
  .vend-card{padding:14px 16px;}
  .vend-card .name{font-size:14.5px;}
  .modal{padding:24px 18px;max-width:300px;}
  .modal input{font-size:22px;padding:14px;letter-spacing:8px;}
  .detail-header h2{font-size:19px;}
  .total-kg-badge{font-size:12.5px;padding:6px 12px;}
  .pedido-head{padding:12px 14px;}
  .pedido-head .right{width:100%;justify-content:space-between;}
  .pedido-head .left{width:100%;}
  .pedido-body{padding:0 14px 14px;}
  .info-grid{grid-template-columns:repeat(2,1fr);gap:8px;font-size:12px;}
  table.prod-table{min-width:560px;font-size:12px;}
  table.prod-table th, table.prod-table td{padding:7px 6px;}
  .back-btn{width:100%;padding:11px;font-size:13.5px;}
}

@media (max-width: 380px){
  .info-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

let vendedorAtual = null;

function formatBRL(v){
  const n = parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  if(isNaN(n)) return v;
  return n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function renderSummary(){
  const nomes = Object.keys(DATA);
  let totalPedidos = 0, totalValor = 0;
  const seen = new Set();
  nomes.forEach(n=>{
    DATA[n].pedidos.forEach(p=>{
      totalPedidos++;
      const key = p.pedido;
      if(!seen.has(key)){
        seen.add(key);
      }
    });
  });
  document.getElementById('summary').innerHTML = `
    <div class="pill"><b>${nomes.length}</b>Vendedores</div>
    <div class="pill"><b>${totalPedidos}</b>Pedidos em aberto</div>
  `;
}

function renderGrid(filter=''){
  const grid = document.getElementById('vendGrid');
  const nomes = Object.keys(DATA).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const f = filter.trim().toLowerCase();
  grid.innerHTML = '';
  let any = false;
  nomes.forEach(nome=>{
    if(f && !nome.toLowerCase().includes(f)) return;
    any = true;
    const v = DATA[nome];
    const card = document.createElement('div');
    card.className = 'vend-card';
    card.onclick = ()=>abrirModal(nome);
    card.innerHTML = `
      <div class="lock">🔒</div>
      <div class="name">${nome}</div>
      <div class="meta">${v.cod_vendedor ? 'Cód. '+v.cod_vendedor : '—'}</div>
      <div class="badge">${v.pedidos.length} pedido${v.pedidos.length===1?'':'s'}</div>
    `;
    grid.appendChild(card);
  });
  if(!any){
    grid.innerHTML = '<div class="empty">Nenhum vendedor encontrado.</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', e=>{
  renderGrid(e.target.value);
});

function abrirModal(nome){
  vendedorAtual = nome;
  document.getElementById('modalNome').textContent = nome;
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('modalBg').classList.add('active');
  setTimeout(()=>document.getElementById('pwInput').focus(), 50);
}

function fecharModal(){
  document.getElementById('modalBg').classList.remove('active');
  vendedorAtual = null;
}

document.getElementById('pwInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') confirmarSenha();
});

function confirmarSenha(){
  const val = document.getElementById('pwInput').value.trim();
  const SENHA_MESTRA = '0000';
  const senhaCorreta = DATA[vendedorAtual].senha;
  const valido = val === SENHA_MESTRA || (Array.isArray(senhaCorreta) ? senhaCorreta.includes(val) : val === senhaCorreta);
  if(valido){
    const nomeConfirmado = vendedorAtual;
    fecharModal();
    abrirDetalhe(nomeConfirmado);
  } else {
    document.getElementById('pwErr').textContent = 'Senha incorreta.';
  }
}

function abrirDetalhe(nome){
  const v = DATA[nome];
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.add('active');
  document.getElementById('detailNome').textContent = nome;
  document.getElementById('detailSub').textContent = `${v.cod_vendedor ? 'Cód. '+v.cod_vendedor+' · ' : ''}${v.pedidos.length} pedido${v.pedidos.length===1?'':'s'} em aberto`;

  var totalKg = 0;
  v.pedidos.forEach(function(p){
    p.produtos.forEach(function(prod){
      var saldoSemGestao = parseFloat(String(prod.saldo_sem_gestao || '0').replace(',', '.')) || 0;
      totalKg += (prod.qtd_liberada_total || 0) + saldoSemGestao;
    });
  });
  var totalKgFmt = totalKg.toLocaleString('pt-BR', {minimumFractionDigits: totalKg % 1 === 0 ? 0 : 2, maximumFractionDigits: 2});
  document.getElementById('detailTotalKg').textContent = totalKgFmt + ' kg liberados';

  const cont = document.getElementById('pedidosContainer');
  cont.innerHTML = '';

  if(v.pedidos.length === 0){
    cont.innerHTML = '<div class="empty">Nenhum pedido em aberto no momento.</div>';
    return;
  }
  v.pedidos.forEach((p, idx)=>{
    const statusClass = p.gestao_pedidos.toLowerCase().includes('liberado') ? 'liberado' : 'outro';
    const card = document.createElement('div');
    card.className = 'pedido-card';
    card.id = 'ped_'+idx;

    let rows = '';
    p.produtos.forEach(prod=>{
      rows += `<tr>
        <td>${prod.cod}</td>
        <td>${prod.nome}</td>
        <td>${prod.qtd_liberada}</td>
        <td>${prod.qtd_liberada_total}</td>
        <td>${prod.peso_cx}</td>
        <td>${prod.saldo_sem_gestao}</td>
      </tr>`;
    });

    card.innerHTML = `
      <div class="pedido-head" onclick="togglePedido(${idx})">
        <div class="left">
          <div class="num">Pedido ${p.pedido} · ${p.data_pedido}</div>
          <div class="cliente">${p.razao_social || p.cliente_loja}</div>
          <div class="cidade">${p.cidade}${p.uf ? '/'+p.uf : ''} · Entrega: ${p.dt_entrega || '—'}</div>
        </div>
        <div class="right">
          <div class="valor">R$ ${formatBRL(p.vl_total_pedido)}</div>
          <div class="status ${statusClass}">${p.gestao_pedidos || p.liberado}</div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="pedido-body">
        <div class="info-grid">
          <div class="item"><b>Cliente/Loja</b><span>${p.cliente_loja}</span></div>
          <div class="item"><b>Bairro</b><span>${p.bairro||'—'}</span></div>
          <div class="item"><b>CEP</b><span>${p.cep||'—'}</span></div>
          <div class="item"><b>Data Pedido</b><span>${p.data_pedido||'—'}</span></div>
          <div class="item"><b>Dt Carregamento</b><span>${p.dt_carregamento||'—'}</span></div>
          <div class="item"><b>Dt Entrega</b><span>${p.dt_entrega||'—'}</span></div>
          <div class="item"><b>Lj Embarque</b><span>${p.lj_embarque||'—'}</span></div>
          <div class="item"><b>Viagem</b><span>${p.viagem||'—'}</span></div>
          <div class="item"><b>Carga</b><span>${p.carga||'—'}</span></div>
        </div>
        <div class="table-scroll">
        <table class="prod-table">
          <thead><tr>
            <th>Cód. Produto</th><th>Produto</th><th>Qtd Liberada</th><th>Qtd Lib. Total</th><th>Peso Cx</th><th>Saldo s/ Gestão</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
        ${p.obs_pedido ? `<div class="obs"><b>Obs.:</b> ${p.obs_pedido}</div>` : ''}
      </div>
    `;
    cont.appendChild(card);
  });
}

function togglePedido(idx){
  document.getElementById('ped_'+idx).classList.toggle('open');
}

function voltarLista(){
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('listView').style.display = 'block';
}

document.getElementById('modalBg').addEventListener('click', e=>{
  if(e.target.id === 'modalBg') fecharModal();
});

function atualizarPagina(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  setTimeout(()=>location.reload(), 250);
}

function aplicarTema(modo){
  document.body.classList.toggle('light', modo === 'light');
  document.getElementById('themeBtn').textContent = modo === 'light' ? '☀️' : '🌙';
  try{ localStorage.setItem('pedidosTema', modo); }catch(e){}
}

function alternarTema(){
  const atual = document.body.classList.contains('light') ? 'light' : 'dark';
  aplicarTema(atual === 'light' ? 'dark' : 'light');
}

(function(){
  let salvo = 'dark';
  try{ salvo = localStorage.getItem('pedidosTema') || 'dark'; }catch(e){}
  aplicarTema(salvo);
})();

renderSummary();
renderGrid();
</script>
